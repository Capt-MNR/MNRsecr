<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17202a" />
    <title>سكرتيري الشخصي</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal AI OS</p>
          <h1>سكرتيري الشخصي</h1>
          <p class="subtitle">اكتب طلبك بطريقتك الطبيعية.</p>
        </div>
        <button id="refresh-button" class="icon-button" type="button" aria-label="تحديث البيانات">
          ↻
        </button>
      </header>

      <section class="auth-panel" aria-label="مصادقة التطوير">
        <label for="dev-token">رمز التطوير</label>
        <div class="auth-row">
          <input id="dev-token" type="password" value="dev-user" autocomplete="off" />
          <button id="save-token" class="secondary-button" type="button">حفظ</button>
        </div>
        <p>يُستخدم محلياً للوصول إلى API التطوير فقط.</p>
      </section>

      <section class="conversation-card">
        <div id="conversation" class="conversation" aria-live="polite"></div>
        <div id="error" class="error" role="alert" hidden></div>
        <form id="message-form" class="composer">
          <textarea
            id="message-input"
            rows="1"
            placeholder="مثال: دفعت لمحمد 11500 جنيه تشطيبات"
            aria-label="رسالة إلى السكرتير"
            required
          ></textarea>
          <button id="send-button" class="send-button" type="submit">إرسال</button>
        </form>
        <p class="temporary-note">المحادثة الحالية مؤقتة؛ البيانات المسجلة تظهر في قسم اليوم.</p>
      </section>

      <section class="today-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">السياق المحفوظ</p>
            <h2>اليوم</h2>
          </div>
          <span id="context-status" class="status">جارٍ التحميل…</span>
        </div>
        <div id="today-grid" class="today-grid"></div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
