[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-os"
version = "0.1.0"
description = "A production-oriented, runtime-neutral Personal AI OS foundation."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[tool.personal-ai-os]
runtime = "first-party"
hermes = "inactive"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
