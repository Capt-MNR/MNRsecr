          enum: [person, project]
        entityId:
          type: string
          format: uuid
        events:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
      required: [entityType, entityId, events]
    PersonProjectRelation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        relationship: { type: ["string", "null"] }
        relationshipId: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
      required: [id, name, status, relationship, relationshipId, updatedAt]
    PersonExpenseRelation:
      type: object
      properties:
        id: { type: string, format: uuid }
        amountMinor: { type: integer }
        currency: { type: string }
        description: { type: string }
        personId: { type: string, format: uuid }
        projectId: { type: ["string", "null"], format: uuid }
        projectName: { type: ["string", "null"] }
        purposeId: { type: ["string", "null"], format: uuid }
        purposeName: { type: ["string", "null"] }
        occurredAt: { type: string, format: date-time }
      required: [id, amountMinor, currency, description, personId, projectId, projectName, purposeId, purposeName, occurredAt]
    PersonCommitmentRelation:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        personId: { type: string, format: uuid }
        dueAt: { type: ["string", "null"], format: date-time }
        status: { type: string }
      required: [id, title, personId, dueAt, status]
    ProjectPersonRelation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        notes: { type: ["string", "null"] }
        relationship: { type: ["string", "null"] }
        relationshipId: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
      required: [id, name, notes, relationship, relationshipId, updatedAt]
    ProjectExpenseRelation:
      type: object
      properties:
        id: { type: string, format: uuid }
        amountMinor: { type: integer }
        currency: { type: string }
        description: { type: string }
        personId: { type: ["string", "null"], format: uuid }
        personName: { type: ["string", "null"] }
        projectId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
      required: [id, amountMinor, currency, description, personId, personName, projectId, occurredAt]
    RecordType:
      type: string
      enum: [expense, person, project, task, reminder, commitment]
    RecordCreateInput:
      type: object
      additionalProperties: false
      properties:
        recordType:
          $ref: "#/components/schemas/RecordType"
        idempotencyKey:
          type: ["string", "null"]
        amountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
        description:
          type: string
        personId:
          type: ["string", "null"]
        projectId:
          type: ["string", "null"]
        purposeId:
          type: ["string", "null"]
        occurredAt:
          type: string
        name:
          type: string
        notes:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        title:
          type: string
        text:
          type: string
        dueAt:
          type: ["string", "null"]
        timezone:
          type: string
        status:
          type: string
      required: [recordType]
    RecordUpdateInput:
      type: object
      additionalProperties: false
      properties:
        expectedRowVersion:
          type: integer
          minimum: 1
        amountMinor:
          type: integer
        currency:
          type: string
        description:
          type: string
        personId:
          type: ["string", "null"]
        projectId:
          type: ["string", "null"]
        purposeId:
          type: ["string", "null"]
        occurredAt:
          type: string
        name:
          type: string
        notes:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        title:
          type: string
        text:
          type: string
        dueAt:
          type: ["string", "null"]
        timezone:
          type: string
        status:
          type: string
    RecordMutationResponse:
      type: object
      properties:
        ok:
          type: boolean
        recordType:
          $ref: "#/components/schemas/RecordType"
        recordId:
          type: string
        record:
          type: object
          additionalProperties: true
        deleted:
          type: boolean
        pendingApproval:
          type: boolean
        approval:
          $ref: "#/components/schemas/ApprovalRequest"
      required: [ok, recordType, recordId]
    ApprovalRequest:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, executing, completed, rejected, expired, failed]
        toolName:
          type: string
        display:
          type: object
          properties:
            title:
              type: string
            details:
              type: array
              items:
                type: string
          required: [title, details]
      required: [operationId, status, toolName, display]
    UndoRecordInput:
      type: object
      properties:
        recordType:
          $ref: "#/components/schemas/RecordType"
        recordId:
          type: string
        createdAt:
          type: string
      required: [recordType, recordId, createdAt]
    ExpenseRecord:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        amountMinor: { type: integer }
        currency: { type: string }
        description: { type: string }
        personId: { type: ["string", "null"] }
        personName: { type: ["string", "null"] }
        projectId: { type: ["string", "null"] }
        projectName: { type: ["string", "null"] }
        purposeId: { type: ["string", "null"] }
        purposeName: { type: ["string", "null"] }
        occurredAt: { type: string }
        createdAt: { type: string }
        rowVersion: { type: integer }
        origin:
          oneOf:
            - $ref: "#/components/schemas/RecordConversationOrigin"
