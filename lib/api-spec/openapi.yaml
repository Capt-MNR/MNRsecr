openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Personal Secretary API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: secretary
    description: Personal secretary operations
  - name: conversations
    description: Conversation history operations
  - name: learning
    description: Review-only learning signal operations
  - name: records
    description: Structured memory records operations
  - name: financial
    description: Financial graph operations
  - name: notifications
    description: Mobile notification registration and delivery operations
  - name: preferences
    description: Explicit account-scoped secretary preferences and temporary context suppression
  - name: auth
    description: Database-backed user sessions
  - name: email
    description: Per-user email provider connection operations
paths:
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a user and private tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthSignupInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthSessionResponse" } } } }
        "400": { description: Invalid signup, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Email already exists, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthCredentials" }
      responses:
        "200": { description: Session created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthSessionResponse" } } } }
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate an authenticated session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200": { description: Rotated session, content: { application/json: { schema: { $ref: "#/components/schemas/AuthSessionResponse" } } } }
        "401": { description: Invalid refresh token, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200": { description: Current user, content: { application/json: { schema: { type: object, required: [user], properties: { user: { $ref: "#/components/schemas/AuthUser" } } } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204": { description: Session revoked }
  /auth/oauth/start:
    post:
      operationId: startAuthOAuth
      tags: [auth]
      summary: Start Google or Microsoft sign-in or account linking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthOAuthStartInput" }
      responses:
        "200": { description: Provider authorization URL, content: { application/json: { schema: { $ref: "#/components/schemas/AuthOAuthStartResponse" } } } }
        "400": { description: Invalid OAuth request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Authentication or password verification required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "503": { description: OAuth provider is not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/oauth/linked:
    get:
      operationId: getAuthOAuthLinkedProviders
      tags: [auth]
      summary: List sign-in providers linked to the current account
      responses:
        "200": { description: Linked providers, content: { application/json: { schema: { $ref: "#/components/schemas/AuthOAuthLinkedProvidersResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/oauth/linked/{provider}:
    delete:
      operationId: unlinkAuthOAuthProvider
      tags: [auth]
      summary: Remove a provider sign-in link from the current account
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, microsoft] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthOAuthUnlinkInput" }
      responses:
        "204": { description: Provider unlinked; existing account data is unchanged }
        "400": { description: Invalid provider or request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "401": { description: Authentication or password verification required, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Provider not linked, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/oauth/ticket/exchange:
    post:
      operationId: exchangeAuthOAuthTicket
      tags: [auth]
      summary: Exchange a one-time mobile OAuth ticket for an app session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthOAuthTicketInput" }
      responses:
        "200": { description: Authenticated session, content: { application/json: { schema: { $ref: "#/components/schemas/AuthSessionResponse" } } } }
        "401": { description: Invalid or expired ticket, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/oauth/google/callback:
    get:
      operationId: completeGoogleOAuthCallback
      tags: [auth]
      summary: Complete the Google OAuth redirect
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to the web app or mobile app }
        "400": { description: Invalid OAuth callback, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /auth/oauth/microsoft/callback:
    get:
      operationId: completeMicrosoftOAuthCallback
      tags: [auth]
      summary: Complete the Microsoft OAuth redirect
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect to the web app or mobile app }
        "400": { description: Invalid OAuth callback, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /email/gmail/account:
    get:
      operationId: getGmailEmailAccount
      tags: [email]
      summary: Get the current user's Gmail connection status
      responses:
        "200":
          description: Gmail connection status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GmailEmailAccountResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: disconnectGmailEmailAccount
      tags: [email]
      summary: Remove the current user's Gmail connection
      responses:
        "204": { description: Gmail connection removed }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /email/gmail/connect:
    post:
      operationId: connectGmailEmailAccount
      tags: [email]
      summary: Start Gmail OAuth for the current user
      responses:
        "200":
          description: Google authorization URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GmailOAuthConnectResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Gmail OAuth is not configured or is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /email/gmail/oauth/callback:
    get:
      operationId: completeGmailEmailOAuth
      tags: [email]
      summary: Complete the one-time Gmail OAuth callback
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 4096 }
        - name: state
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        "303": { description: Redirect to the email connection status page }
  /calendar/google/account:
    get:
      operationId: getGoogleCalendarAccount
      tags: [calendar]
      summary: Get the current user's Google Calendar connection status
      responses:
        "200":
          description: Calendar connection status and the granted Calendar scopes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleCalendarAccountResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: disconnectGoogleCalendarAccount
      tags: [calendar]
      summary: Disconnect and revoke the current user's Google Calendar account
      responses:
        "200":
          description: Local connection removed; revoked reports Google's revocation response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleCalendarDisconnectResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /calendar/google/connect:
    post:
      operationId: connectGoogleCalendarAccount
      tags: [calendar]
      summary: Start Google Calendar OAuth for the current user
      responses:
        "200":
          description: Google authorization URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleCalendarOAuthConnectResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Google Calendar OAuth is not configured or is disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /calendar/google/oauth/callback:
    get:
      operationId: completeGoogleCalendarOAuth
      tags: [calendar]
      summary: Complete the one-time Google Calendar OAuth callback
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, maxLength: 4096 }
        - name: state
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: error
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        "303": { description: Redirect to the connected accounts page }
  /push-tokens:
    post:
      operationId: registerMobilePushToken
      tags: [notifications]
      summary: Register a mobile push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMobilePushTokenInput"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobilePushTokenResponse"
        "400":
          description: Invalid token registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    delete:
      operationId: unregisterMobilePushToken
      tags: [notifications]
      summary: Disable a mobile push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterMobilePushTokenInput"
      responses:
        "200":
          description: Token disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobilePushTokenResponse"
        "400":
          description: Invalid token registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /proactive-preferences:
    get:
      operationId: getProactivePreferences
      tags: [preferences]
      summary: Get the authenticated user's explicit secretary preferences
      responses:
        "200":
          description: Effective preferences and which values were explicitly selected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProactivePreferences" }
    patch:
      operationId: updateProactivePreferences
      tags: [preferences]
      summary: Update explicit account-scoped secretary preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProactivePreferencesUpdate" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProactivePreferences" }
        "400":
          description: Invalid preference value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /proactive-suppressions:
    post:
      operationId: createProactiveSuppression
      tags: [preferences]
      summary: Temporarily suppress proactive messages for one active record version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProactiveSuppressionInput" }
      responses:
        "201":
          description: Temporary suppression created or refreshed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProactiveSuppressionResponse" }
        "400":
          description: Invalid entity or inactive record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Record is unavailable to the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Record is no longer active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /entities/{entityType}/{entityId}:
    get:
      operationId: getEntityGraph
      tags: [entities]
      summary: Get a bounded entity detail graph
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string, enum: [person, project, financial_party] } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Entity detail with related records and timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityGraphResponse" }
        "404":
          description: Entity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /relationships:
    get:
      operationId: listTypedRelationships
      tags: [entities]
      summary: List bounded typed relationships for an entity
      parameters:
        - { name: relation, in: query, required: true, schema: { type: string } }
        - { name: side, in: query, required: false, schema: { type: string, enum: [left, right], default: left } }
        - { name: entityId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Typed relationships
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationshipListResponse" }
    post:
      operationId: createTypedRelationship
      tags: [entities]
      summary: Create a typed relationship through approval
      parameters:
        - { name: relation, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelationshipMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /relationships/{relation}/{relationshipId}:
    delete:
      operationId: deleteTypedRelationship
      tags: [entities]
      summary: Delete one typed relationship through approval
      parameters:
        - { name: relation, in: path, required: true, schema: { type: string } }
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/parties:
    get:
      operationId: listFinancialParties
      tags: [financial]
      summary: List scoped financial parties
      responses:
        "200":
          description: Financial parties
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialListResponse" }
    post:
      operationId: createFinancialParty
      tags: [financial]
      summary: Create a financial party
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201":
          description: Created or approved result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMutationResponse" }
        "202":
          description: Approval required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMutationResponse" }
  /financial/parties/{partyId}:
    get:
      operationId: getFinancialParty
      tags: [financial]
      summary: Get a financial party graph
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Financial party and related records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialEntityResponse" }
        "404":
          description: Financial party not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /financial/obligations:
    get:
      operationId: listFinancialObligations
      tags: [financial]
      summary: List advances and debts
      responses:
        "200":
          description: Obligations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialListResponse" }
    post:
      operationId: createFinancialObligation
      tags: [financial]
      summary: Create an advance or debt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/obligations/{obligationId}/settlements:
    post:
      operationId: settleFinancialObligation
      tags: [financial]
      summary: Apply a payment partially or fully to an obligation
      parameters:
        - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Settlement created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/payments:
    get:
      operationId: listFinancialPayments
      tags: [financial]
      summary: List actual payments
      responses:
        "200": { description: Payments, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createFinancialPayment
      tags: [financial]
      summary: Record an actual payer-to-payee payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/obligations/{obligationId}:
    patch:
      operationId: updateFinancialObligation
      tags: [financial]
      summary: Correct an obligation
      parameters:
        - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/payments/{paymentId}:
    patch:
      operationId: updateFinancialPayment
      tags: [financial]
      summary: Correct an actual payment
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/donations/{donationId}:
    patch:
      operationId: updateDonation
      tags: [financial]
      summary: Correct a donation
      parameters:
        - { name: donationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/receivables/{receivableId}:
    patch:
      operationId: updateIncomeReceivable
      tags: [financial]
      summary: Correct income or a receivable
      parameters:
        - { name: receivableId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/donations:
    get:
      operationId: listDonations
      tags: [financial]
      summary: List donations and pledges
      responses:
        "200": { description: Donations, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createDonation
      tags: [financial]
      summary: Create a donation pledge or payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/receivables:
    get:
      operationId: listIncomeReceivables
      tags: [financial]
      summary: List expected income and receivables
      responses:
        "200": { description: Income and receivables, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createIncomeReceivable
      tags: [financial]
      summary: Create expected income or a receivable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/payment-links:
    get:
      operationId: listPaymentLinks
      tags: [financial]
      summary: List payment links
      responses:
        "200": { description: Payment links, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createPaymentLink
      tags: [financial]
      summary: Create a scoped payment link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
