      responses:
        "200":
          description: Person graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonGraphResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}:
    get:
      operationId: getProjectGraph
      tags: [entities]
      summary: Get a project with related people, expenses, and activity
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGraphResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /entities/{entityType}/{entityId}/timeline:
    get:
      operationId: getEntityTimeline
      tags: [entities]
      summary: Get the activity timeline for a person or project
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [person, project]
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entity activity timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTimelineResponse"
        "400":
          description: Invalid entity type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /records/{recordType}/{recordId}:
    patch:
      operationId: updateRecord
      tags: [records]
      summary: Update one structured memory record
      parameters:
        - name: recordType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordType"
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpdateInput"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "400":
          description: Invalid record update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRecord
      tags: [records]
      summary: Delete one structured memory record
      parameters:
        - name: recordType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordType"
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "400":
          description: Invalid delete request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /records/undo:
    post:
      operationId: undoCreatedRecord
      tags: [records]
      summary: Safely undo a just-created record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoRecordInput"
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "400":
          description: Invalid undo request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found or changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      required: [status]
    AgentWork:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [monitor, reminder, recurring_task, external_action, research, workflow] }
        title: { type: string }
        description: { type: ["string", "null"] }
        status: { type: string, enum: [draft, active, paused, waiting, needs_review, completed, failed, cancelled] }
        source: { type: object, additionalProperties: true }
        condition: { type: object, additionalProperties: true }
        action: { type: object, additionalProperties: true }
        schedule: { type: object, additionalProperties: true }
        nextRunAt: { type: ["string", "null"], format: date-time }
        lastRunAt: { type: ["string", "null"], format: date-time }
        lastRunStatus: { type: ["string", "null"] }
        rowVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        required: [id, kind, title, description, status, source, condition, action, schedule, nextRunAt, lastRunAt, lastRunStatus, rowVersion, createdAt, updatedAt]
    AgentWorkRun:
      type: object
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        attempt: { type: integer }
        status: { type: string, enum: [queued, claimed, running, verifying, verified, unchanged, failed, uncertain, needs_review] }
        idempotencyKey: { type: string }
        leaseExpiresAt: { type: ["string", "null"], format: date-time }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        verification: { type: ["object", "null"], additionalProperties: true }
        error: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, workId, attempt, status, idempotencyKey, leaseExpiresAt, startedAt, completedAt, verification, error, createdAt, updatedAt]
    AgentWorkEvent:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        runId: { type: ["string", "null"], format: uuid }
        eventType: { type: string }
        actorType: { type: string }
        actorId: { type: ["string", "null"] }
        summary: { type: string }
        metadata: { type: object, additionalProperties: true }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, workId, runId, eventType, actorType, actorId, summary, metadata, occurredAt, createdAt]
    AgentWorkEvidence:
      type: object
      properties:
        id: { type: string, format: uuid }
        workId: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        snapshotHash: { type: string }
        snapshot: { type: object, additionalProperties: true }
        retentionClass: { type: string, enum: [standard, sensitive] }
        expiresAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, workId, runId, snapshotHash, snapshot, retentionClass, expiresAt, createdAt]
    AgentWorkCreateInput:
      type: object
      properties:
        kind: { type: string, enum: [monitor, reminder, recurring_task, external_action, research, workflow] }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"], maxLength: 2000 }
        source: { type: object, additionalProperties: true }
        condition: { type: object, additionalProperties: true }
        action: { type: object, additionalProperties: true }
        schedule: { type: object, additionalProperties: true }
        nextRunAt: { type: ["string", "null"], format: date-time }
      required: [kind, title]
    AgentWorkStatusInput:
      type: object
      properties:
        from: { type: string, enum: [draft, active, paused, waiting, needs_review, completed, failed, cancelled] }
        to: { type: string, enum: [draft, active, paused, waiting, needs_review, completed, failed, cancelled] }
        reason: { type: string, maxLength: 500 }
      required: [from, to]
    AgentWorkDetails:
      type: object
      properties:
        work: { $ref: "#/components/schemas/AgentWork" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/AgentWorkRun" }
        events:
          type: array
          items: { $ref: "#/components/schemas/AgentWorkEvent" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/AgentWorkEvidence" }
      required: [work, runs, events, evidence]
    AuthUser:
      type: object
      properties:
        userId: { type: string }
        tenantId: { type: string }
        email: { type: string, format: email }
      required: [userId, tenantId, email]
    AuthCredentials:
      type: object
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 12, maxLength: 256 }
      required: [email, password]
    AuthSignupInput:
      allOf:
        - $ref: "#/components/schemas/AuthCredentials"
        - type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
    AuthSessionResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        accessToken: { type: string }
        refreshToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }
      required: [user, accessExpiresAt, refreshExpiresAt]
    AuthOAuthProvider:
      type: string
      enum: [google, microsoft]
    AuthOAuthStartInput:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/AuthOAuthProvider" }
        mode: { type: string, enum: [login, link] }
        client: { type: string, enum: [web, mobile] }
        currentPassword: { type: string, minLength: 12, maxLength: 256 }
        returnTo: { type: string, maxLength: 512 }
      required: [provider, mode, client]
    AuthOAuthStartResponse:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
      required: [authorizationUrl]
    AuthOAuthLinkedProvider:
      type: object
      properties:
        provider: { $ref: "#/components/schemas/AuthOAuthProvider" }
        emailAddress: { type: ["string", "null"], format: email }
        linkedAt: { type: string, format: date-time }
      required: [provider, emailAddress, linkedAt]
    AuthOAuthLinkedProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/AuthOAuthLinkedProvider" }
      required: [providers]
    AuthOAuthUnlinkInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 12, maxLength: 256 }
      required: [currentPassword]
    AuthOAuthTicketInput:
      type: object
      properties:
        ticket: { type: string, minLength: 16, maxLength: 512 }
      required: [ticket]
    GmailEmailAccountResponse:
      type: object
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        emailAddress: { type: ["string", "null"], format: email }
      required: [configured, connected, emailAddress]
    GmailOAuthConnectResponse:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
      required: [authorizationUrl]
    GoogleCalendarAccountResponse:
      type: object
      properties:
        configured: { type: boolean }
        connected: { type: boolean }
        emailAddress: { type: ["string", "null"], format: email }
        grantedScopes:
          type: array
          items: { type: string }
      required: [configured, connected, emailAddress, grantedScopes]
    GoogleCalendarOAuthConnectResponse:
      type: object
      properties:
        authorizationUrl: { type: string, format: uri }
      required: [authorizationUrl]
    GoogleCalendarDisconnectResponse:
      type: object
      properties:
        disconnected: { type: boolean, const: true }
        revoked: { type: boolean }
      required: [disconnected, revoked]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        category:
          type: string
          enum:
            - validation_error
            - authentication_error
            - permission_error
            - conflict_error
            - not_found
            - rate_limit
            - timeout
            - provider_error
            - provider_rate_limit
            - provider_unavailable
            - agent_error
            - response_parse_error
            - internal_error
        requestId:
          type: string
        retryable:
          type: boolean
        provider:
          type: string
      required: [error]
    TurnInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        conversationId:
          type: ["string", "null"]
        idempotencyKey:
          type: ["string", "null"]
        channel:
          type: string
          enum: [main, quick, record]
        context:
          anyOf:
            - $ref: "#/components/schemas/SecretaryChatContext"
            - type: "null"
        peer:
          anyOf:
            - $ref: "#/components/schemas/SecretaryChatPeer"
            - type: "null"
        inputId:
          type: ["string", "null"]
          maxLength: 100
      required: [message, channel]
      additionalProperties: false
    InputAssetProcessInput:
      type: object
      properties:
        kind:
          type: string
          enum: [voice, receipt]
        mimeType:
          type: string
          maxLength: 100
        base64:
          type: string
          minLength: 1
          maxLength: 12000000
      required: [kind, mimeType, base64]
      additionalProperties: false
    InputAssetProcessResponse:
      type: object
      properties:
        inputId:
          type: string
          description: Stable reference for retrying the bounded result and linking it to its secretary turn.
        kind:
          type: string
          enum: [voice, receipt]
        text:
          type: string
        receipt:
          type: object
          properties:
            merchant:
              type: ["string", "null"]
            amountMinor:
              type: ["integer", "null"]
            currency:
              type: ["string", "null"]
            occurredAt:
              type: ["string", "null"]
            description:
              type: ["string", "null"]
            confidence:
              type: number
          required: [merchant, amountMinor, currency, occurredAt, description, confidence]
        processing:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            inputTokens:
              type: ["integer", "null"]
            outputTokens:
              type: ["integer", "null"]
            cacheHit:
              type: boolean
          required: [provider, model, inputTokens, outputTokens, cacheHit]
      required: [inputId, kind, text, processing]
    SecretaryChatContext:
      type: object
      properties:
        recordType:
          type: string
          minLength: 1
          maxLength: 80
        recordId:
          type: string
          minLength: 1
          maxLength: 200
        title:
          type: string
          minLength: 1
          maxLength: 200
        sourceConversationId:
          type: ["string", "null"]
          maxLength: 200
        sourceTurnId:
          type: ["string", "null"]
          maxLength: 200
        sourceOperationId:
          type: ["string", "null"]
          maxLength: 200
      required: [recordType, recordId, title]
      additionalProperties: false
    SecretaryChatPeer:
      type: object
      properties:
        agentId:
          type: string
          minLength: 1
          maxLength: 200
        displayName:
          type: string
          maxLength: 200
        protocol:
          type: string
          maxLength: 80
        capabilities:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 100
      required: [agentId]
      additionalProperties: false
    SecretaryA2ATurnMetadata:
      type: object
      description: Metadata carried by an A2A peer so a remote secretary can preserve the local turn boundary.
      properties:
        conversationId:
          type: ["string", "null"]
        channel:
          type: string
          enum: [main, quick, record]
        context:
          anyOf:
            - $ref: "#/components/schemas/SecretaryChatContext"
            - type: "null"
        peer:
          anyOf:
            - $ref: "#/components/schemas/SecretaryChatPeer"
            - type: "null"
        inputId:
          type: ["string", "null"]
          maxLength: 100
        idempotencyKey:
          type: ["string", "null"]
      required: [conversationId, channel, context, peer, inputId, idempotencyKey]
      additionalProperties: false
    SecretaryA2AMessage:
      type: object
      description: User message envelope used by the mobile A2A secretary transport.
      properties:
        messageId:
          type: string
        role:
          type: string
          enum: [user]
        parts:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [text]
              text:
                type: string
                minLength: 1
            required: [kind, text]
            additionalProperties: false
        metadata:
          type: object
          properties:
            secretary:
              $ref: "#/components/schemas/SecretaryA2ATurnMetadata"
          required: [secretary]
          additionalProperties: false
      required: [messageId, role, parts, metadata]
      additionalProperties: false
    SecretaryA2ARequest:
      type: object
      description: JSON-RPC request methods supported by the external secretary transport.
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          type: string
        method:
          type: string
          enum:
            - message/send
            - secretary/conversations/list
            - secretary/conversations/get
            - secretary/approvals/approve
            - secretary/approvals/reject
        params:
          type: object
          additionalProperties: true
      required: [jsonrpc, id, method, params]
      additionalProperties: false
    ActionResult:
      type: object
      additionalProperties: true
    FinalResponse:
      type: object
      properties:
        kind:
          type: string
          enum: [answer, clarification, not_found, error]
        message:
          type: string
        groundedFacts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [money, count]
              value:
                type: integer
              currency:
                type: string
              label:
                type: string
            required: [type, value]
      required: [kind, message]
    TurnResponse:
      type: object
      properties:
        conversationId:
          type: string
        turnId:
          type: string
        assistantMessage:
          type: string
        action:
          $ref: "#/components/schemas/ActionResult"
        response:
          $ref: "#/components/schemas/FinalResponse"
        provider:
          type: string
        model:
          type: string
      required: [conversationId, turnId, assistantMessage, provider, model]
    ApprovalResponse:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, executing, completed, rejected, expired, failed]
        conversationId:
          type: string
        turnId:
          type: string
        assistantMessage:
          type: string
        action:
          $ref: "#/components/schemas/ActionResult"
        response:
          $ref: "#/components/schemas/FinalResponse"
        provider:
          type: string
        model:
          type: string
      required: [operationId, status, conversationId, turnId, assistantMessage, provider, model]
    ApprovalInput:
      type: object
      properties:
        args:
          type: object
          additionalProperties: true
      additionalProperties: false
    ApprovalOperation:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        conversationId:
          type: ["string", "null"]
        toolName:
          type: string
        args:
          type: object
          additionalProperties: true
        display:
          type: object
          properties:
            title:
              type: string
            details:
              type: array
              items:
                type: string
          required: [title, details]
        status:
          type: string
          enum: [pending, executing, completed, rejected, expired, failed]
        updatedAt:
          type: string
          format: date-time
      required: [operationId, toolName, args, display, status, updatedAt]
    PendingApprovalSummary:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        conversationId:
          type: ["string", "null"]
        toolName:
          type: string
        display:
          type: object
          properties:
            title:
              type: string
            details:
              type: array
              items:
                type: string
          required: [title, details]
        status:
          type: string
          enum: [pending]
        updatedAt:
          type: string
          format: date-time
      required: [operationId, toolName, display, status, updatedAt]
    PendingApprovalListResponse:
      type: object
      properties:
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/PendingApprovalSummary"
      required: [approvals]
    RegisterMobilePushTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 8
        provider:
          type: string
          enum: [expo, fcm, apns]
        platform:
          type: string
          enum: [android, ios]
        appId:
          type: string
          minLength: 1
        deviceId:
          type: ["string", "null"]
      required: [token, provider, platform, appId]
      additionalProperties: false
    UnregisterMobilePushTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 8
      required: [token]
      additionalProperties: false
    MobilePushTokenResponse:
      type: object
      properties:
        registered:
          type: boolean
        enabled:
          type: boolean
      required: [registered, enabled]
    ProactivePreferences:
      type: object
      additionalProperties: false
      properties:
        activity: { type: string, enum: [focused, balanced, quiet] }
        proactive: { type: string, enum: [low, balanced, high] }
        intelligence: { type: string, enum: [fast, balanced, deep] }
        communicationStyle: { type: string, enum: [formal, friendly, concise, balanced] }
        language: { type: string, enum: [ar, en] }
        repeatReminders: { type: boolean }
        explicitFields:
          type: array
          items:
            type: string
            enum: [activity, proactive, intelligence, communicationStyle, language, repeatReminders]
      required: [activity, proactive, intelligence, communicationStyle, language, repeatReminders, explicitFields]
    ProactivePreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        activity: { type: ["string", "null"], enum: [focused, balanced, quiet, null] }
        proactive: { type: ["string", "null"], enum: [low, balanced, high, null] }
        intelligence: { type: ["string", "null"], enum: [fast, balanced, deep, null] }
        communicationStyle: { type: ["string", "null"], enum: [formal, friendly, concise, balanced, null] }
        language: { type: ["string", "null"], enum: [ar, en, null] }
        repeatReminders: { type: ["boolean", "null"] }
    ProactiveSuppressionInput:
      type: object
      additionalProperties: false
      properties:
        entityType: { type: string, enum: [task, commitment] }
        entityId: { type: string, format: uuid }
        sourceConversationId: { type: ["string", "null"] }
        sourceTurnId: { type: ["string", "null"] }
      required: [entityType, entityId]
    ProactiveSuppressionResponse:
      type: object
      additionalProperties: false
      properties:
        suppressed: { type: boolean }
        entityType: { type: string, enum: [task, commitment] }
        entityId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
      required: [suppressed, entityType, entityId, expiresAt]
    Candidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
      required: [id, name, status]
    ReminderSummary:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        dueAt:
          type: string
        timezone:
          type: string
        status:
          type: string
      required: [id, text, dueAt, timezone, status]
    ExpenseSummary:
      type: object
      properties:
        id:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
        description:
          type: string
