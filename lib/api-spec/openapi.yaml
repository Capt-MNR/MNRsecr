        title: { type: string }
        dueAt: { type: ["string", "null"] }
        status: { type: string }
        createdAt: { type: string }
        rowVersion: { type: integer }
        origin:
          oneOf:
            - $ref: "#/components/schemas/RecordConversationOrigin"
