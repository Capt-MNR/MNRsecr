openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Personal Secretary API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: secretary
    description: Personal secretary operations
  - name: conversations
    description: Conversation history operations
  - name: records
    description: Structured memory records operations
  - name: financial
    description: Financial graph operations
paths:
  /entities/{entityType}/{entityId}:
    get:
      operationId: getEntityGraph
      tags: [entities]
      summary: Get a bounded entity detail graph
      parameters:
        - { name: entityType, in: path, required: true, schema: { type: string, enum: [person, project, financial_party] } }
        - { name: entityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Entity detail with related records and timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntityGraphResponse" }
        "404":
          description: Entity not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /relationships:
    get:
      operationId: listTypedRelationships
      tags: [entities]
      summary: List bounded typed relationships for an entity
      parameters:
        - { name: relation, in: query, required: true, schema: { type: string } }
        - { name: side, in: query, required: false, schema: { type: string, enum: [left, right], default: left } }
        - { name: entityId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Typed relationships
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelationshipListResponse" }
    post:
      operationId: createTypedRelationship
      tags: [entities]
      summary: Create a typed relationship through approval
      parameters:
        - { name: relation, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelationshipMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /relationships/{relation}/{relationshipId}:
    delete:
      operationId: deleteTypedRelationship
      tags: [entities]
      summary: Delete one typed relationship through approval
      parameters:
        - { name: relation, in: path, required: true, schema: { type: string } }
        - { name: relationshipId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/parties:
    get:
      operationId: listFinancialParties
      tags: [financial]
      summary: List scoped financial parties
      responses:
        "200":
          description: Financial parties
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialListResponse" }
    post:
      operationId: createFinancialParty
      tags: [financial]
      summary: Create a financial party
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201":
          description: Created or approved result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMutationResponse" }
        "202":
          description: Approval required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialMutationResponse" }
  /financial/parties/{partyId}:
    get:
      operationId: getFinancialParty
      tags: [financial]
      summary: Get a financial party graph
      parameters:
        - { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Financial party and related records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialEntityResponse" }
        "404":
          description: Financial party not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /financial/obligations:
    get:
      operationId: listFinancialObligations
      tags: [financial]
      summary: List advances and debts
      responses:
        "200":
          description: Obligations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialListResponse" }
    post:
      operationId: createFinancialObligation
      tags: [financial]
      summary: Create an advance or debt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/obligations/{obligationId}/settlements:
    post:
      operationId: settleFinancialObligation
      tags: [financial]
      summary: Apply a payment partially or fully to an obligation
      parameters:
        - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Settlement created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/payments:
    get:
      operationId: listFinancialPayments
      tags: [financial]
      summary: List actual payments
      responses:
        "200": { description: Payments, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createFinancialPayment
      tags: [financial]
      summary: Record an actual payer-to-payee payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/obligations/{obligationId}:
    patch:
      operationId: updateFinancialObligation
      tags: [financial]
      summary: Correct an obligation
      parameters:
        - { name: obligationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/payments/{paymentId}:
    patch:
      operationId: updateFinancialPayment
      tags: [financial]
      summary: Correct an actual payment
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/donations/{donationId}:
    patch:
      operationId: updateDonation
      tags: [financial]
      summary: Correct a donation
      parameters:
        - { name: donationId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/receivables/{receivableId}:
    patch:
      operationId: updateIncomeReceivable
      tags: [financial]
      summary: Correct income or a receivable
      parameters:
        - { name: receivableId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/donations:
    get:
      operationId: listDonations
      tags: [financial]
      summary: List donations and pledges
      responses:
        "200": { description: Donations, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createDonation
      tags: [financial]
      summary: Create a donation pledge or payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/receivables:
    get:
      operationId: listIncomeReceivables
      tags: [financial]
      summary: List expected income and receivables
      responses:
        "200": { description: Income and receivables, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createIncomeReceivable
      tags: [financial]
      summary: Create expected income or a receivable
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /financial/payment-links:
    get:
      operationId: listPaymentLinks
      tags: [financial]
      summary: List payment links
      responses:
        "200": { description: Payment links, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialListResponse" } } } }
    post:
      operationId: createPaymentLink
      tags: [financial]
      summary: Create a scoped payment link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinancialMutationInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
        "202": { description: Approval required, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialMutationResponse" } } } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /today:
    get:
      operationId: getTodayContext
      tags: [secretary]
      summary: Get the persisted today context
      responses:
        "200":
          description: Persisted personal context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayContextResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Route not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Provider rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Agent or internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Provider timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /turns:
    post:
      operationId: createTurn
      tags: [secretary]
      summary: Send a natural-language message to the secretary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnInput"
      responses:
        "200":
          description: Assistant result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /approvals/{operationId}/approve:
    post:
      operationId: approveSecretaryOperation
      tags: [secretary]
      summary: Approve and execute one stored secretary operation
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Approval status or stored operation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Approval operation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /approvals/{operationId}:
    get:
      operationId: getSecretaryOperation
      tags: [secretary]
      summary: Get one scoped approval operation for editing
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stored approval operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalOperation"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Approval operation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /approvals/{operationId}/reject:
    post:
      operationId: rejectSecretaryOperation
      tags: [secretary]
      summary: Reject one stored secretary operation
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rejection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Approval operation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List recent conversations
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Conversation summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Load a conversation and its recent turns
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /records:
    get:
      operationId: listRecords
      tags: [records]
      summary: List structured memory records
      responses:
        "200":
          description: Structured records grouped by type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /candidates:
    get:
      operationId: getCandidates
      tags: [records]
      summary: Search scoped person or project candidates
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [person, project]
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Up to ten matching candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Candidate"
        "400":
          description: Invalid candidate query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createRecord
      tags: [records]
      summary: Create a saved record manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCreateInput"
      responses:
        "200":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "202":
          description: Record creation is waiting for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "400":
          description: Invalid record data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to create record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /people/{personId}:
    get:
      operationId: getPersonGraph
      tags: [entities]
      summary: Get a person with related projects, expenses, commitments, and activity
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Person graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonGraphResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Person not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{projectId}:
    get:
      operationId: getProjectGraph
      tags: [entities]
      summary: Get a project with related people, expenses, and activity
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Project graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGraphResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /entities/{entityType}/{entityId}/timeline:
    get:
      operationId: getEntityTimeline
      tags: [entities]
      summary: Get the activity timeline for a person or project
      parameters:
        - name: entityType
          in: path
          required: true
          schema:
            type: string
            enum: [person, project]
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entity activity timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityTimelineResponse"
        "400":
          description: Invalid entity type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /records/{recordType}/{recordId}:
    patch:
      operationId: updateRecord
      tags: [records]
      summary: Update one structured memory record
      parameters:
        - name: recordType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordType"
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpdateInput"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "400":
          description: Invalid record update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRecord
      tags: [records]
      summary: Delete one structured memory record
      parameters:
        - name: recordType
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RecordType"
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "400":
          description: Invalid delete request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /records/undo:
    post:
      operationId: undoCreatedRecord
      tags: [records]
      summary: Safely undo a just-created record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoRecordInput"
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordMutationResponse"
        "400":
          description: Invalid undo request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found or changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        category:
          type: string
          enum:
            - validation_error
            - authentication_error
            - permission_error
            - conflict_error
            - not_found
            - rate_limit
            - timeout
            - provider_error
            - provider_rate_limit
            - provider_unavailable
            - agent_error
            - response_parse_error
            - internal_error
        requestId:
          type: string
        retryable:
          type: boolean
        provider:
          type: string
      required: [error]
    TurnInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
        conversationId:
          type: ["string", "null"]
        idempotencyKey:
          type: ["string", "null"]
      required: [message]
    ActionResult:
      type: object
      additionalProperties: true
    FinalResponse:
      type: object
      properties:
        kind:
          type: string
          enum: [answer, clarification, not_found, error]
        message:
          type: string
        groundedFacts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [money, count]
              value:
                type: integer
              currency:
                type: string
              label:
                type: string
            required: [type, value]
      required: [kind, message]
    TurnResponse:
      type: object
      properties:
        conversationId:
          type: string
        assistantMessage:
          type: string
        action:
          $ref: "#/components/schemas/ActionResult"
        response:
          $ref: "#/components/schemas/FinalResponse"
        provider:
          type: string
        model:
          type: string
      required: [conversationId, assistantMessage, provider, model]
    ApprovalResponse:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, executing, completed, rejected, expired, failed]
        conversationId:
          type: string
        assistantMessage:
          type: string
        action:
          $ref: "#/components/schemas/ActionResult"
        response:
          $ref: "#/components/schemas/FinalResponse"
        provider:
          type: string
        model:
          type: string
      required: [operationId, status, conversationId, assistantMessage, provider, model]
    ApprovalInput:
      type: object
      properties:
        args:
          type: object
          additionalProperties: true
      additionalProperties: false
    ApprovalOperation:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        conversationId:
          type: ["string", "null"]
        toolName:
          type: string
        args:
          type: object
          additionalProperties: true
        display:
          type: object
          properties:
            title:
              type: string
            details:
              type: array
              items:
                type: string
          required: [title, details]
        status:
          type: string
          enum: [pending, executing, completed, rejected, expired, failed]
        updatedAt:
          type: string
          format: date-time
      required: [operationId, toolName, args, display, status, updatedAt]
    Candidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
      required: [id, name, status]
    ReminderSummary:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        dueAt:
          type: string
        timezone:
          type: string
        status:
          type: string
      required: [id, text, dueAt, timezone, status]
    ExpenseSummary:
      type: object
      properties:
        id:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
        description:
          type: string
        personName:
          type: ["string", "null"]
        projectName:
          type: ["string", "null"]
        occurredAt:
          type: string
      required: [id, amountMinor, currency, description, occurredAt]
    NamedItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
    PendingTask:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        dueAt:
          type: ["string", "null"]
        status:
          type: string
      required: [id, title, status]
    TodayContext:
      type: object
      properties:
        upcomingReminders:
          type: array
          items:
            $ref: "#/components/schemas/ReminderSummary"
        recentExpenses:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseSummary"
        activeProjects:
          type: array
          items:
            $ref: "#/components/schemas/NamedItem"
        relevantPeople:
          type: array
          items:
            $ref: "#/components/schemas/NamedItem"
        pendingTasks:
          type: array
          items:
            $ref: "#/components/schemas/PendingTask"
        asOf:
          type: string
      required:
        - upcomingReminders
        - recentExpenses
        - activeProjects
        - relevantPeople
        - pendingTasks
        - asOf
    TodayContextResponse:
      type: object
      properties:
        context:
          $ref: "#/components/schemas/TodayContext"
      required: [context]
    ConversationTurn:
      type: object
      additionalProperties: true
      properties:
        turnId:
          type: string
        userMessage:
          type: string
        assistantMessage:
          type: string
        createdAt:
          type: string
        action:
          type: object
          additionalProperties: true
      required: [userMessage, assistantMessage, createdAt]
    RecordConversationOrigin:
      type: object
      properties:
        conversationId:
          type: string
        turnId:
          type: ["string", "null"]
        operationId:
          type: ["string", "null"]
      required: [conversationId, turnId, operationId]
    ConversationSummary:
      type: object
      properties:
        conversationId:
          type: string
        title:
          type: string
        preview:
          type: string
        lastActivityAt:
          type: string
        turnCount:
          type: integer
      required: [conversationId, title, preview, lastActivityAt, turnCount]
    ConversationListResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
      required: [conversations]
    ConversationDetail:
      type: object
      properties:
        conversationId:
          type: string
        title:
          type: string
        lastActivityAt:
          type: string
        turnCount:
          type: integer
        recentTurns:
          type: array
          items:
            $ref: "#/components/schemas/ConversationTurn"
        summary:
          type: ["string", "null"]
        state:
          type: object
          additionalProperties: true
      required: [conversationId, title, lastActivityAt, turnCount, recentTurns, summary, state]
    ActivityEvent:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        sourceType: { type: string }
        sourceId: { type: ["string", "null"], format: uuid }
        actorType: { type: string }
        summary: { type: string }
        metadata:
          type: object
          additionalProperties: true
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, eventType, sourceType, sourceId, actorType, summary, metadata, occurredAt, createdAt]
    PersonGraphResponse:
      type: object
      properties:
        entity:
          $ref: "#/components/schemas/PersonRecord"
        related:
          type: object
          properties:
